<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de Coordenadas das Fotos</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#667;--br:#d9dce1;--ac:#1a73e8;--ok:#188038;--warn:#b06000}
  @media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2226;--tx:#eceff2;--mut:#9aa3ad;--br:#333a41;--ac:#6ea8fe;--ok:#6fd08c;--warn:#f0b35a}}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
  h1{font-size:20px;margin:0 0 12px}
  .drop{border:2px dashed var(--br);border-radius:12px;padding:28px;text-align:center;background:var(--card);cursor:pointer}
  .drop.over{border-color:var(--ac)}
  button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
  button.sec{background:transparent;color:var(--ac);border:1px solid var(--br)}
  button.wa+button.wa{margin-left:12px}
  button.wa{background:none;border:0;padding:0;font:inherit;color:var(--ac);text-decoration:underline;cursor:pointer}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
  #status{color:var(--mut);font-size:13px}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
  th,td{padding:8px;border-bottom:1px solid var(--br);text-align:left;white-space:nowrap}
  th{font-size:12px;color:var(--mut);text-transform:uppercase}
  td img{width:64px;height:44px;object-fit:cover;border-radius:6px;display:block;cursor:pointer}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
  input.c{width:110px;padding:5px;border:1px solid var(--br);border-radius:6px;background:var(--bg);color:var(--tx)}
  .ok{color:var(--ok)}.warn{color:var(--warn)}
  td.st{white-space:normal;min-width:170px}
  td.st small{color:var(--mut)}
  a{color:var(--ac)}
</style>
</head>
<body>
<h1>Leitor de Coordenadas das Fotos</h1>
<div class="drop" id="drop">Toque ou arraste as fotos aqui</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="bar">
  <button id="clear" class="sec">Limpar</button>
  <span id="status"></span>
</div>

<div class="lb" id="lb"><img id="lbimg" alt=""></div>

<div class="wrap">
<table>
  <thead><tr><th>Enviada em</th><th>Foto</th><th>Arquivo</th><th>Latitude</th><th>Longitude</th><th>Endereço</th><th>Status</th><th>Mapa</th><th>Copiar</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>

  const GW = 12, GH = 16;
  let modelos = null;
  function carregarModelos() {
    if (modelos) return modelos;
    const bin = atob(OCR_DATA), vs = [];
    for (let s = 0; s < OCR_N; s++) {
      const v = new Float32Array(GW * GH);
      for (let i = 0; i < GW * GH; i += 2) {
        const b = bin.charCodeAt(s * 96 + i / 2);
        v[i] = (b >> 4) / 15; v[i + 1] = (b & 15) / 15;
      }
      vs.push({ label: OCR_LABELS[s], v });
    }
    return (modelos = vs);
  }
  function carregarImagem(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = url;
    });
  }
  function fotoCinza(img, lado) {
    const sc = lado / Math.max(img.width, img.height);
    const W = Math.round(img.width * sc), H = Math.round(img.height * sc);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, W, H);
    const p = g.getImageData(0, 0, W, H).data, gray = new Uint8ClampedArray(W * H);
    for (let i = 0; i < W * H; i++) gray[i] = 0.299 * p[i*4] + 0.587 * p[i*4+1] + 0.114 * p[i*4+2];
    return { gray, W, H };
  }
  // top-hat: tira fundo claro/liso (cano, parede, chão) e deixa só traços finos
  function filtroMinMax(src, W, H, k, ehMin) {
    const r = k >> 1, t = new Uint8ClampedArray(W * H), o = new Uint8ClampedArray(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let m = ehMin ? 255 : 0;
      for (let d = -r; d <= r; d++) {
        const xx = x + d < 0 ? 0 : x + d >= W ? W - 1 : x + d, v = src[y * W + xx];
        if (ehMin ? v < m : v > m) m = v;
      }
      t[y * W + x] = m;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let m = ehMin ? 255 : 0;
      for (let d = -r; d <= r; d++) {
        const yy = y + d < 0 ? 0 : y + d >= H ? H - 1 : y + d, v = t[yy * W + x];
        if (ehMin ? v < m : v > m) m = v;
      }
      o[y * W + x] = m;
    }
    return o;
  }
  function tophat(gray, W, H, k) {
    const op = filtroMinMax(filtroMinMax(gray, W, H, k, true), W, H, k, false);
    const o = new Uint8ClampedArray(W * H);
    for (let i = 0; i < W * H; i++) o[i] = gray[i] - op[i];
    return o;
  }
  // componentes conectados (pixels ligados da máscara) numa região
  function componentes(mask, W, H, x0, y0) {
    const lab = new Uint8Array(W * H), out = [];
    for (let y = y0; y < H; y++) for (let x = x0; x < W; x++) {
      const i = y * W + x;
      if (!mask[i] || lab[i]) continue;
      const st = [i]; lab[i] = 1;
      let minx = x, maxx = x, miny = y, maxy = y, area = 0;
      while (st.length) {
        const j = st.pop(), jx = j % W, jy = (j - jx) / W;
        area++;
        if (jx < minx) minx = jx; if (jx > maxx) maxx = jx;
        if (jy < miny) miny = jy; if (jy > maxy) maxy = jy;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = jx + dx, ny = jy + dy;
          if (nx < x0 || nx >= W || ny < y0 || ny >= H) continue;
          const k = ny * W + nx;
          if (mask[k] && !lab[k]) { lab[k] = 1; st.push(k); }
        }
      }
      out.push({ minx, maxx, miny, maxy, w: maxx - minx + 1, h: maxy - miny + 1, area });
    }
    return out;
  }

  // agrupa componentes do tamanho de um dígito em linhas de texto
  function acharLinhas(cs) {
    const g = cs.filter(c => c.h >= 8 && c.h <= 24 && c.w <= 20)
                .sort((a, b) => (a.miny + a.maxy) - (b.miny + b.maxy));
    const cl = [];
    for (const c of g) {
      const cy = (c.miny + c.maxy) / 2;
      let k = cl.find(k => Math.abs(k.cy - cy) <= 4);
      if (!k) { k = { cy, items: [] }; cl.push(k); }
      k.items.push(c);
      k.cy = k.items.reduce((s, c) => s + (c.miny + c.maxy) / 2, 0) / k.items.length;
    }
    return cl.filter(k => k.items.length >= 8).sort((a, b) => b.cy - a.cy); // de baixo p/ cima
  }

  // classifica os pedaços de uma linha em dígito (d), traço (-) e ponto/vírgula (s)
  function classificarLinha(cs, k) {
    const n = k.items.length;
    const hm = k.items.map(c => c.h).sort((a, b) => a - b)[n >> 1];
    const base = k.items.map(c => c.maxy).sort((a, b) => a - b)[n >> 1];
    const top = base - hm + 1;
    const xmin = Math.min(...k.items.map(c => c.minx)), xmax = Math.max(...k.items.map(c => c.maxx));
    const res = [];
    for (const c of cs) {
      if (c.maxx < xmin - hm * 2.2 || c.minx > xmax + hm * 0.8) continue;
      const cy = (c.miny + c.maxy) / 2;
      if (cy < top - 2 || cy > base + hm * 0.3 || c.miny < top - 3) continue;
      if (c.h >= hm * 0.7 && c.h <= hm * 1.4 && c.w <= hm * 1.05) { res.push({ t: 'd', c }); continue; }
      if (c.h <= Math.max(3, hm * 0.3) && c.w >= hm * 0.25 && c.w <= hm * 0.8 &&
          c.miny >= top + hm * 0.2 && c.maxy <= top + hm * 0.8) { res.push({ t: '-', c }); continue; }
      if (c.w <= hm * 0.5 && c.h <= hm * 0.5 && c.area >= 2 &&
          c.maxy >= base - 2 && c.maxy <= base + hm * 0.35) { res.push({ t: 's', c }); continue; }
    }
    res.sort((a, b) => a.c.minx - b.c.minx);
    return { itens: res, hm, top, base };
  }

  // recorta o caractere e reduz para 12x16 (média por área), normalizado
  function recorte(gray, W, H, c) {
    const pad = 1, x0 = c.minx - pad, y0 = c.miny - pad;
    const sw = c.w + 2 * pad, sh = c.h + 2 * pad, out = new Float32Array(GW * GH);
    for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
      const fx0 = x0 + i * sw / GW, fx1 = x0 + (i + 1) * sw / GW;
      const fy0 = y0 + j * sh / GH, fy1 = y0 + (j + 1) * sh / GH;
      let s = 0, n = 0;
      for (let y = Math.floor(fy0); y < Math.ceil(fy1); y++) for (let x = Math.floor(fx0); x < Math.ceil(fx1); x++) {
        const wx = Math.min(x + 1, fx1) - Math.max(x, fx0), wy = Math.min(y + 1, fy1) - Math.max(y, fy0);
        if (wx <= 0 || wy <= 0) continue;
        const xx = Math.min(W - 1, Math.max(0, x)), yy = Math.min(H - 1, Math.max(0, y));
        s += gray[yy * W + xx] * wx * wy; n += wx * wy;
      }
      out[j * GW + i] = n ? s / n : 0;
    }
    let mn = 1e9, mx = -1e9;
    for (const v of out) { if (v < mn) mn = v; if (v > mx) mx = v; }
    const d = Math.max(1, mx - mn);
    for (let i = 0; i < out.length; i++) out[i] = (out[i] - mn) / d;
    return out;
  }

  // devolve o dígito mais parecido, a distância e a distância do 2º colocado (outro dígito)
  function digitoMaisParecido(v) {
    let best = 1e9, lab = '?', seg = 1e9;
    const melhorPorLab = {};
    for (const m of carregarModelos()) {
      let d = 0;
      for (let i = 0; i < v.length; i++) { const e = v[i] - m.v[i]; d += e * e; }
      if (d < (melhorPorLab[m.label] ?? 1e9)) melhorPorLab[m.label] = d;
    }
    for (const l in melhorPorLab) {
      const d = melhorPorLab[l];
      if (d < best) { seg = best; best = d; lab = l; } else if (d < seg) seg = d;
    }
    return { lab, dist: best, seg };
  }

  // plausível para o Brasil (lat -35..6, long -75..-33)
  const plausivel = (la, lo) => la > -35 && la < 6 && lo > -75 && lo < -33;

  // Monta lat/long a partir dos dígitos lidos. Não depende de enxergar ponto, vírgula
  // ou sinal: usa as lacunas entre os dígitos + o que é plausível para o Brasil.
  // dig = [{ minx, maxx, ch }], minus/seps = [{ minx, maxx }]
  function montarCoordenadas(dig, minus, seps, hm) {
    const n = dig.length;
    if (n < 8 || n > 20) return [];
    const ch = dig.map(d => d.ch);
    const gap = i => dig[i + 1].minx - dig[i].maxx;
    const minusAntes = i => minus.some(m => m.maxx <= dig[i].minx + 1 && m.maxx >= dig[i].minx - hm * 1.6);
    const sepEntre = i => seps.some(s => s.minx >= dig[i].maxx - 1 && s.maxx <= dig[i + 1].minx + 1);
    const cands = [];
    // onde termina a latitude: as maiores lacunas (vírgula + espaço + sinal)
    const idx = [...Array(n - 1).keys()].filter(i => i >= 3 && i <= n - 6).sort((a, b) => gap(b) - gap(a)).slice(0, 2);
    for (const corte of idx) {
      const partes = [[0, corte], [corte + 1, n - 1]], nums = [];
      for (const [a, b] of partes) {
        const len = b - a + 1, opcoes = [];
        for (let ni = 1; ni <= 3; ni++) {   // quantos dígitos antes do ponto
          if (len - ni < 3 || len - ni > 9) continue;
          opcoes.push({ ni, sep: sepEntre(a + ni - 1), score: gap(a + ni - 1) + (sepEntre(a + ni - 1) ? 100 : 0) });
        }
        opcoes.sort((p, q) => q.score - p.score);
        nums.push({ a, b, opcoes: opcoes.slice(0, 2), neg: minusAntes(a) });
      }
      for (const oa of nums[0].opcoes) for (const ob of nums[1].opcoes) {
        const mk = (p, o) => parseFloat(ch.slice(p.a, p.a + o.ni).join('') + '.' + ch.slice(p.a + o.ni, p.b + 1).join(''));
        const la0 = mk(nums[0], oa), lo0 = mk(nums[1], ob);
        const lats = nums[0].neg ? [-la0] : [-la0, la0], los = nums[1].neg ? [-lo0] : [-lo0, lo0];
        for (const la of lats) for (const lo of los) if (plausivel(la, lo)) {
          cands.push({ lat: la, lon: lo, pontos: (oa.sep ? 8 : 0) + (ob.sep ? 8 : 0) + (oa === nums[0].opcoes[0] ? 2 : 0) + (ob === nums[1].opcoes[0] ? 2 : 0) +
            (nums[0].neg ? 1 : 0) + (nums[1].neg ? 1 : 0) + (corte === idx[0] ? 2 : 0) +
            ((nums[0].b - nums[0].a + 1 - oa.ni) === (nums[1].b - nums[1].a + 1 - ob.ni) ? 4 : 0),
            casas: [nums[0].b - nums[0].a + 1 - oa.ni, nums[1].b - nums[1].a + 1 - ob.ni], ndig: n });
        }
      }
    }
    cands.sort((p, q) => q.pontos - p.pontos);
    return cands.slice(0, 1);
  }

  // relê cada dígito numa caixa fixa (posição achada pelo voto), no filtro de traços
  // finos: o resultado não depende mais do limiar que quebrou ou colou o caractere.
  // Testa pequenos deslocamentos da caixa e fica com o que mais parece um dígito.
  function lerCaixa(hat, gray, W, H, x0, x1, top, base) {
    let melhor = { lab: '?', dist: 1e9 };
    for (const dx0 of [0, -1, 1]) for (const dx1 of [0, 1, -1]) {
      const a = x0 + dx0, b = x1 + dx1;
      if (b - a < 2) continue;
      const c = { minx: a, maxx: b, miny: top, maxy: base, w: b - a + 1, h: base - top + 1 };
      const r = digitoMaisParecido(recorte(hat, W, H, c));
      if (r.dist < melhor.dist) melhor = r;
    }
    return melhor;
  }
  const energia = (hat, W, x0, x1, top, base) => {
    let n = 0;
    for (let y = top; y <= base; y++) for (let x = x0; x <= x1; x++) if (hat[y * W + x] >= 45) n++;
    return n;
  };

  // CONFERE A CONTAGEM: procura tinta de dígito (toca o topo E a base da linha) que nenhuma
  // caixa de dígito nem sinal de menos explica. Vírgula/ponto (só na base) e menos (só no
  // meio) não entram. Cada trecho achado é um dígito que a leitura deixou passar.
  function tintaSemLeitura(dig, minus, hat, W, top, base) {
    const n = dig.length;
    if (n < 4) return [];
    const med = a => a.slice().sort((p, q) => p - q)[a.length >> 1];
    const w0 = Math.max(3, med(dig.map(d => d.maxx - d.minx + 1)));
    const cs = dig.slice(1).map((d, i) => (d.minx + d.maxx) / 2 - (dig[i].minx + dig[i].maxx) / 2).filter(v => v > 0 && v <= w0 * 2.2);
    const pitch = cs.length ? med(cs) : w0 * 1.4;
    const en0 = med(dig.map(d => energia(hat, W, d.minx, d.maxx, top, base)));
    const h = base - top + 1, faixa = Math.max(2, Math.round(h * 0.2));
    const a = Math.max(1, Math.round(dig[0].minx - pitch * 1.5));
    const b = Math.min(W - 2, Math.round(dig[n - 1].maxx + pitch * 1.5));
    const coberto = x => dig.some(d => x >= d.minx - 1 && x <= d.maxx + 1) || minus.some(m => x >= m.minx - 1 && x <= m.maxx + 1);
    const runs = [];
    let r = null;
    for (let x = a; x <= b; x++) {
      if (coberto(x)) continue;
      let tinta = 0, topo = false, fundo = false;
      for (let y = top; y <= base; y++) if (hat[y * W + x] >= 45) {
        tinta++;
        if (y < top + faixa) topo = true;
        if (y > base - faixa) fundo = true;
      }
      if (!tinta) continue;
      if (r && x - r.maxx <= 2) { r.maxx = x; r.tinta += tinta; r.topo = r.topo || topo; r.fundo = r.fundo || fundo; }
      else { r = { minx: x, maxx: x, tinta, topo, fundo }; runs.push(r); }
    }
    return runs.filter(q => q.maxx - q.minx + 1 >= Math.max(2, w0 * 0.4) && q.topo && q.fundo && q.tinta >= en0 * 0.45)
               .map(q => ({ minx: q.minx, maxx: q.maxx, w0, pitch }));
  }

  // Dígitos colados (ou apagados no limiar) deixam um buraco com tinta no meio da linha:
  // lê o buraco direto. Só fecha buracos no meio; sobra nas pontas vira aviso.
  // Devolve quantos trechos continuam sem leitura (0 = contagem bate com a imagem).
  function completarPorTinta(dig, minus, hat, W, top, base, ler) {
    let ach = 0;
    for (let rodada = 0; rodada < 2; rodada++) {
      const rs = tintaSemLeitura(dig, minus, hat, W, top, base);
      let mudou = false;
      for (const r of rs) {
        if (!(r.maxx > dig[0].minx && r.minx < dig[dig.length - 1].maxx)) continue;   // ponta: não mexe
        const larg = r.maxx - r.minx + 1;
        const k = Math.max(1, Math.round((larg + (r.pitch - r.w0)) / r.pitch));
        for (let i = 0; i < k; i++) {
          const x0 = Math.round(r.minx + (k > 1 ? i * (larg - r.w0) / (k - 1) : (larg - r.w0) / 2));
          const novo = { minx: x0, maxx: x0 + Math.round(r.w0 - 1) };
          ler(novo);
          if (novo.dist <= 12) { dig.push(novo); ach++; mudou = true; }
        }
      }
      if (!mudou) break;
      dig.sort((p, q) => p.minx - q.minx);
    }
    return { ach, sobra: tintaSemLeitura(dig, minus, hat, W, top, base).length };
  }

  function reclassificar(dig, minus, hat, gray, W, H, top, base) {
    const ler = d => { const r = lerCaixa(hat, gray, W, H, d.minx, d.maxx, top, base); d.ch = r.lab; d.dist = r.dist; d.margem = r.seg / Math.max(r.dist, 0.5); };
    dig.forEach(ler);
    // dígito perdido no meio: duas posições vizinhas com um "buraco" do tamanho de um dígito
    const ps = dig.length > 3 ? dig.slice(1).map((d, i) => (d.minx + d.maxx) / 2 - (dig[i].minx + dig[i].maxx) / 2).filter(v => v <= 11).sort((a, b) => a - b) : [];
    const p0 = ps.length ? ps[ps.length >> 1] : 0;
    if (p0) {
      const en0 = dig.map(d => energia(hat, W, d.minx, d.maxx, top, base)).sort((a, b) => a - b)[dig.length >> 1];
      const w0 = Math.round(dig.map(d => d.maxx - d.minx).sort((a, b) => a - b)[dig.length >> 1]);
      for (let i = 0; i < dig.length - 1; i++) {
        const dc = (dig[i + 1].minx + dig[i + 1].maxx) / 2 - (dig[i].minx + dig[i].maxx) / 2;
        if (dc < p0 * 1.75 || dc > p0 * 2.3) continue;
        const cx = (dig[i].minx + dig[i].maxx) / 2 + dc / 2, x0 = Math.round(cx - w0 / 2);
        if (energia(hat, W, x0, x0 + w0, top, base) < en0 * 0.5) continue;
        const novo = { minx: x0, maxx: x0 + w0 };
        ler(novo);
        if (novo.dist <= 12) { dig.splice(i + 1, 0, novo); i++; }
      }
    }
    // dígito perdido nas pontas (o "1" fino do começo, por exemplo): olha mais um passo
    const pas = dig.length > 3 ? dig.slice(1).map((d, i) => d.minx - dig[i].minx).filter(v => v <= 11).sort((a, b) => a - b) : [];
    const passo = pas.length ? pas[pas.length >> 1] : 0;
    const en = dig.map(d => energia(hat, W, d.minx, d.maxx, top, base)).sort((a, b) => a - b)[dig.length >> 1];
    const w = Math.round(dig.map(d => d.maxx - d.minx).sort((a, b) => a - b)[dig.length >> 1]);
    if (passo) for (const lado of [-1, 1]) for (let t = 0; t < 2; t++) {
      const ref = lado < 0 ? dig[0] : dig[dig.length - 1];
      const x0 = ref.minx + lado * passo;
      if (x0 < 1 || x0 + w >= W - 1) break;
      const novo = { minx: x0, maxx: x0 + w };
      if (energia(hat, W, novo.minx, novo.maxx, top, base) < en * 0.5) break;
      ler(novo);
      if (novo.dist > 11) break;
      if (lado < 0) dig.unshift(novo); else dig.push(novo);
    }
    const conf = completarPorTinta(dig, minus, hat, W, top, base, ler);
    return { dist: dig.reduce((s, d) => s + d.dist, 0) / (dig.length || 1), sobra: conf.sobra };
  }

  // junta as leituras de várias máscaras: cada caractere fica numa posição fixa da
  // foto, então o voto é por posição (um erro de uma máscara é coberto pelas outras)
  function fundirLeituras(leituras, apoioMin) {
    const agrupar = (lista, tol) => {
      lista.sort((a, b) => a.cx - b.cx);
      const gs = [];
      for (const d of lista) {
        const g = gs[gs.length - 1];
        if (g && Math.abs(d.cx - g.cx) <= tol) { g.its.push(d); g.cx = g.its.reduce((s, x) => s + x.cx, 0) / g.its.length; }
        else gs.push({ cx: d.cx, its: [d] });
      }
      return gs;
    };
    const med = a => a.map(x => x).sort((p, q) => p - q)[a.length >> 1];
    const hm = med(leituras.map(l => l.hm));
    const tol = Math.max(2, hm * 0.3);
    const dets = [], mins = [], sps = [];
    for (const l of leituras) for (const x of l.itens) {
      const o = { cx: (x.c.minx + x.c.maxx) / 2, minx: x.c.minx, maxx: x.c.maxx, ch: x.ch };
      (x.t === 'd' ? dets : x.t === '-' ? mins : sps).push(o);
    }
    const dig = [];
    for (const g of agrupar(dets, tol)) {
      if (g.its.length < apoioMin) continue;
      const cont = {};
      for (const d of g.its) cont[d.ch] = (cont[d.ch] || 0) + 1;
      const ch = Object.keys(cont).sort((a, b) => cont[b] - cont[a])[0];
      const ws = g.its.map(d => d.maxx - d.minx + 1).sort((p, q) => p - q);
      const w = ws[Math.min(ws.length - 1, Math.floor(ws.length * 0.7))], c = med(g.its.map(d => d.cx));
      dig.push({ minx: Math.round(c - (w - 1) / 2), maxx: Math.round(c + (w - 1) / 2), ch, apoio: cont[ch] });
    }
    // tira "dígitos" soltos nas pontas (ruído do chão/parede): pouco apoio ou longe do resto
    const apoioMax = Math.max(1, ...dig.map(d => d.apoio));
    while (dig.length > 1 && dig[0].apoio < apoioMax * 0.15) dig.shift();
    while (dig.length > 1 && dig[dig.length - 1].apoio < apoioMax * 0.15) dig.pop();
    while (dig.length > 1 && dig[1].minx - dig[0].maxx > hm * 2.5) dig.shift();
    while (dig.length > 1 && dig[dig.length - 1].minx - dig[dig.length - 2].maxx > hm * 2.5) dig.pop();
    const juntar = lista => agrupar(lista, tol * 1.5).filter(g => g.its.length >= 2)
      .map(g => ({ minx: med(g.its.map(d => d.minx)), maxx: med(g.its.map(d => d.maxx)) }));
    return { dig, minus: juntar(mins), seps: juntar(sps), hm };
  }
  const T_HAT = [80, 65, 50, 40, 32];
  const G_MIN = [140, 155, 170, 185, 200, 215];
  const LIMIARES = [225, 205, 185, 165];
  const ESCALAS = [700, 1000, 500];

  // tenta vários "recortes" do texto (máscaras), lê cada um e junta as leituras
  async function lerDeCinza(gray, W, H, votos, fx, fy) {
    const hat = tophat(gray, W, H, 7);
    const mascaras = [];
    for (const T of T_HAT) for (const G of G_MIN) mascaras.push({ T, G, hat: true });
    for (const T of LIMIARES) mascaras.push({ T, G: 0, hat: false });
    const x0 = Math.floor(W * fx), y0 = Math.floor(H * fy);
    const linhasPorY = [];                       // leituras agrupadas pela altura da linha
    for (const m of mascaras) {
      await new Promise(r => setTimeout(r, 0));
      const mask = new Uint8Array(W * H);
      if (m.hat) for (let i = 0; i < W * H; i++) mask[i] = (hat[i] >= m.T && gray[i] >= m.G) ? 1 : 0;
      else for (let i = 0; i < W * H; i++) mask[i] = gray[i] >= m.T ? 1 : 0;
      const cs = componentes(mask, W, H, x0, y0);
      for (const k of acharLinhas(cs).slice(0, 4)) {
        const { itens, hm, top, base } = classificarLinha(cs, k);
        const src = m.hat ? hat : gray;
        for (const x of itens) if (x.t === 'd') x.ch = digitoMaisParecido(recorte(src, W, H, x.c)).lab;
        let g = linhasPorY.find(l => Math.abs(l.cy - k.cy) <= 5);
        if (!g) { g = { cy: k.cy, leituras: [] }; linhasPorY.push(g); }
        g.leituras.push({ itens, hm, top, base });
      }
    }
    for (const g of linhasPorY) {
      if (g.leituras.length < 3) continue;
      const med = a => a.slice().sort((p, q) => p - q)[a.length >> 1];
      const top = med(g.leituras.map(l => l.top)), base = med(g.leituras.map(l => l.base));
      for (const apoio of [2, 3, 4]) {
        const f = fundirLeituras(g.leituras, Math.min(apoio, Math.ceil(g.leituras.length / 2)));
        if (f.dig.length < 8) continue;
        const rc = reclassificar(f.dig, f.minus, hat, gray, W, H, top, base);
        for (const r of montarCoordenadas(f.dig, f.minus, f.seps, f.hm)) {
          const chave = r.lat.toFixed(7) + '|' + r.lon.toFixed(7);
          const v = votos.get(chave) || { r, n: 0, dist: 0, sobra: 1e9 };
          v.n++; v.dist = Math.max(v.dist, rc.dist); v.sobra = Math.min(v.sobra, rc.sobra); votos.set(chave, v);
        }
      }
    }
  }

  // Obs.: alguns apps de câmera omitem o zero final (-11.1621 e -37.97342 = -11.16210 e -37.97342),
  // então lat e long com nº de casas diferente NÃO é erro por si só. Só vale como suspeita
  // quando outro sinal confirma que sobrou/faltou dígito na leitura.
  function decidir(votos) {
    const lista = [...votos.values()].sort((a, b) => (b.n - a.n) || (a.sobra - b.sobra));
    if (!lista.length) return null;
    const igual = v => v.r.casas[0] === v.r.casas[1];
    const seguroDe = v => { const o = lista.filter(x => x !== v); return v.n >= 2 && (!o.length || v.n >= o[0].n * 2); };
    let t = lista[0];
    // só troca por uma leitura com casas iguais se a primeira já tem sinal de problema
    if (!igual(t) && (t.sobra > 0 || !seguroDe(t))) {
      const alt = lista.find(v => v !== t && igual(v) && v.n >= Math.max(2, t.n * 0.5));
      if (alt) t = alt;
    }
    const seguro = seguroDe(t);
    const motivos = [];
    if (t.sobra > 0) motivos.push('na foto tem dígito que não consegui ler' + (!igual(t) ? ' (lat e long com nº de casas diferentes)' : ''));
    else if (Math.max(...t.r.casas) < 4) motivos.push('poucas casas decimais');
    if (!seguro) motivos.push('leituras diferentes entre si');
    if (t.dist > 14) motivos.push('dígitos pouco nítidos');
    return { lat: t.r.lat, lon: t.r.lon, ndig: t.r.ndig, incerto: motivos.length > 0, motivo: motivos.join('; ') };
  }

  // devolve { lat, lon, incerto } ou null
  const ESCALAS_EXTRA = [850, 1300, 600];
  async function lerCoordenadaDaFoto(file) {
    const img = await carregarImagem(file);
    const votos = new Map();
    const fim = r => r;
    let r = null;
    for (const lado of ESCALAS) {
      const { gray, W, H } = fotoCinza(img, lado);
      await lerDeCinza(gray, W, H, votos, 0.30, 0.55);   // canto inferior direito
      r = decidir(votos);
      if (r && !r.incerto) return fim(r);
    }
    if (r) {                                              // achou, mas com dúvida: tenta de novo em outros tamanhos
      for (const lado of ESCALAS_EXTRA) {
        const { gray, W, H } = fotoCinza(img, lado);
        await lerDeCinza(gray, W, H, votos, 0.30, 0.55);
        r = decidir(votos);
        if (r && !r.incerto) return fim(r);
      }
      return r;                                           // continua pedindo conferência
    }
    for (const lado of ESCALAS.slice(0, 2)) {             // reserva: metade de baixo inteira
      const { gray, W, H } = fotoCinza(img, lado);
      await lerDeCinza(gray, W, H, votos, 0, 0.40);
      r = decidir(votos);
      if (r) return fim(r);
    }
    return null;
  }
  // ==OCR_END==


function stamp(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function readImage(file){
  const url = URL.createObjectURL(file);
  const r = await lerCoordenadaDaFoto(file);
  if(r) return {url, file, lat: r.lat, lon: r.lon, date: '', fixed: r.incerto, motivo: r.motivo, ndig: r.ndig};
  return {url, file, lat: null, lon: null, date: ''};
}

async function handle(files){
  if(busy) return;
  busy = true;
  const list = [...files].filter(f => f.type.startsWith('image/'));
  let pos = 0;
  for(let i = 0; i < list.length; i++){
    statusEl.textContent = `Lendo ${i+1}/${list.length}...`;
    try{
      const r = await readImage(list[i]);
      const item = {name: list[i].name, sent: stamp(), ...r};
      data.splice(pos++, 0, item);
      queueGeo(item);
    }catch(e){
      console.error(e);
      data.splice(pos++, 0, {name: list[i].name, sent: stamp(), file: list[i], url:'', lat:null, lon:null, date:''});
    }
    render();
  }
  statusEl.textContent = 'Pronto ✔';
  busy = false;
}

// ---- endereço (rua + cidade) pelas coordenadas: OpenStreetMap/Nominatim, 1 busca por segundo ----
const geoCache = new Map(), geoQueue = [];
let geoRunning = false;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const okNum = v => v !== null && v !== undefined && !isNaN(v);

function addrCell(r, found){
  if(!found) return '';
  const a = r.addr;
  if(!a) return '<span style="color:var(--mut)">-</span>';
  if(a.msg) return `<span style="color:var(--mut)">${esc(a.msg)}</span>`;
  return `${a.rua ? esc(a.rua) : '<span style="color:var(--mut)">(sem nome de rua)</span>'}<br><small style="color:var(--mut)">${esc(a.cidade || '-')}</small>`;
}

function queueGeo(item){
  if(!okNum(item.lat) || !okNum(item.lon)){ item.addr = null; render(); return; }
  const key = item.lat.toFixed(5) + ',' + item.lon.toFixed(5);
  item.geoKey = key;
  if(geoCache.has(key)){ item.addr = geoCache.get(key); render(); return; }
  item.addr = {msg: 'Buscando...'};
  render();
  geoQueue.push(item);
  runGeo();
}

async function runGeo(){
  if(geoRunning) return;
  geoRunning = true;
  while(geoQueue.length){
    const item = geoQueue.shift();
    const key = item.geoKey;
    if(!okNum(item.lat) || item.lat.toFixed(5) + ',' + item.lon.toFixed(5) !== key) continue;
    let res;
    try{
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=pt-BR&lat=${item.lat}&lon=${item.lon}`;
      const resp = await fetch(url);
      if(!resp.ok) throw new Error(resp.status);
      const j = await resp.json();
      const a = j.address || {};
      const rua = a.road || a.pedestrian || a.footway || a.path || a.residential || a.cycleway || '';
      let cidade = a.city || a.town || a.village || a.municipality || a.city_district || a.county || '';
      const uf = (a['ISO3166-2-lvl4'] || '').split('-')[1];
      if(cidade && uf) cidade += ' - ' + uf;
      res = (rua || cidade) ? {rua: rua + (rua && a.house_number ? ', ' + a.house_number : ''), cidade} : {msg: 'Não encontrado'};
      geoCache.set(key, res);
    }catch(e){
      res = {msg: 'Sem conexão'};
    }
    if(item.geoKey === key) item.addr = res;
    render();
    await sleep(1100);
  }
  geoRunning = false;
}

// Link do mapa normal
function svLink(lat, lon){
  return `https://www.google.com/maps/place/${lat},${lon}/@${lat},${lon},17z`;
}

function render(){
  rows.innerHTML = '';
  data.forEach((r, i) => {
    const tr = document.createElement('tr');
    const found = r.lat !== null && r.lon !== null && !isNaN(r.lat) && !isNaN(r.lon);
    tr.innerHTML = `
      <td>${r.sent || '-'}</td>
      <td>${r.url ? `<img src="${r.url}" data-i="${i}">` : ''}</td>
      <td>${r.name}</td>
      <td><input class="c" data-i="${i}" data-k="lat" value="${found ? r.lat : ''}"></td>
      <td><input class="c" data-i="${i}" data-k="lon" value="${found ? r.lon : ''}"></td>
      <td>${addrCell(r, found)}</td>
      <td class="st ${found ? (r.fixed ? 'warn' : 'ok') : 'warn'}">${found ? (r.fixed ? 'Confira os números' + (r.motivo ? '<br><small>' + esc(r.motivo) + '</small>' : '') : 'OK' + (r.ndig ? '<br><small>' + r.ndig + ' dígitos conferidos</small>' : '')) : 'Não achei – digite'}</td>
      <td>${found ? `<a target="_blank" href="${svLink(r.lat, r.lon)}">Abrir</a>` : ''}</td>
      <td>${found ? `<button class="wa" data-i="${i}" data-t="foto">Foto</button><button class="wa" data-i="${i}" data-t="link">Link</button>` : ''}</td>`;
    rows.appendChild(tr);
  });
}

function filePng(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0);
      c.toBlob(b => { URL.revokeObjectURL(u); b ? res(b) : rej(); }, 'image/png');
    };
    im.onerror = rej;
    im.src = u;
  });
}

rows.addEventListener('click', e => {
  const b = e.target.closest('.wa');
  if(!b) return;
  const r = data[b.dataset.i];
  const link = `${svLink(r.lat, r.lon)}`;
  const label = b.dataset.t === 'link' ? 'Link' : 'Foto';
  const ok = () => { b.textContent = 'Copiado ✔'; setTimeout(() => { b.textContent = label; }, 1500); };
  const falha = () => { b.textContent = 'Erro'; setTimeout(() => { b.textContent = label; }, 1500); };

  if(b.dataset.t === 'link'){
    navigator.clipboard.writeText(link).then(ok).catch(falha);
    return;
  }
  // celular: menu de compartilhar com a foto + link
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile && r.file && navigator.canShare && navigator.canShare({files: [r.file]})){
    navigator.share({files: [r.file], text: link}).catch(() => {});
    return;
  }
  // computador: copia só a foto (o WhatsApp Web ignora o texto quando há imagem)
  try{
    navigator.clipboard.write([new ClipboardItem({'image/png': filePng(r.file)})]).then(ok).catch(falha);
  }catch(_){ falha(); }
});

const lb = $('#lb'), lbimg = $('#lbimg');
rows.addEventListener('click', e => {
  const im = e.target.closest('img');
  if(!im) return;
  lbimg.src = data[im.dataset.i].url;
  lb.classList.add('on');
});
lb.onclick = () => { lb.classList.remove('on'); lbimg.src = ''; };

rows.addEventListener('change', e => {
  const el = e.target;
  if(!el.dataset.k) return;
  const v = parseFloat(el.value.replace(',', '.'));
  data[el.dataset.i][el.dataset.k] = isNaN(v) ? null : v;
  data[el.dataset.i].fixed = false; data[el.dataset.i].motivo = ''; data[el.dataset.i].ndig = 0;
  render();
  queueGeo(data[el.dataset.i]);
});

$('#clear').onclick = () => { data = []; geoQueue.length = 0; render(); statusEl.textContent = ''; };

const drop = $('#drop'), file = $('#file');
drop.onclick = () => file.click();
file.onchange = () => { handle(file.files); file.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle(e.dataTransfer.files); };
</script>
